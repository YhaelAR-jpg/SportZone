<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/Zp.css">
</head>
<body>
    <!--NAVEGACIÓN -->
    <div id="nav-placeholder"></div>
    <!--FOOTER-->
    
    <h1 class="titulo">Catalogo</h1>

    <main class="contenedor-ca">
        
        <br>
        <div id="catalogoSec">

            <div class="col">
                <a href="Tennis.html">
                    <img src="IMG/Tennislogo.jpeg" alt="">
                </a>
            </div>

            <div class="col">
                <a href="Balones.html">
                    <img src="IMG/Balonlogo.jpeg" alt="">
                </a>
            </div>

            <div class="col">
                <a href="playeras.html">
                    <img src="IMG/Playeralogo.jpeg" alt="">
                </a>
            </div>

            <div class="col">
                <a href="calcetas.html">
                    <img src="IMG/Calcetaslogo.jpeg" alt="">
                </a>
            </div>

        </div>
        <div class="botones">
            <Button><a href="index.html">Cancelar</Button>
        </div>
    </main>
    <br>
    <br>
    <br>
    <br>
    <br>
    <div id="footer"></div>
</body>
<script>
    fetch('nav.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('nav-placeholder').innerHTML = data;
        
        })
        .catch(err => console.error('Error cargando el menú:', err));


    fetch('footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer').innerHTML = data;
        
        })
        .catch(err => console.error('Error cargando el menú:', err));    
</script>
<script>
    const toggleBtn = document.querySelector(".menu-toggle");
    const nav = document.getElementById("nav-placeholder");

    toggleBtn.addEventListener("click", () => {
        nav.classList.toggle("active");
    });
</script>

</html>
